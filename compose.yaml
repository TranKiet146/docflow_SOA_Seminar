name: docflow

services:
  gateway:
    image: docflow-gateway:0.5.0

    build:
      context: ./gateway

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    networks:
      - edge-net

    restart: unless-stopped

  redis:
    image: redis:7.4-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - job-net

    restart: unless-stopped

  api:
    image: docflow-backend:0.5.0

    build:
      context: ./backend

    environment:
      SERVICE_NAME: docflow-api
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QUEUE_NAME: ${QUEUE_NAME:-document-jobs}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      RESULT_DIR: ${RESULT_DIR:-/data/results}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-60}
      RESULT_TTL_SECONDS: ${RESULT_TTL_SECONDS:-86400}

    depends_on:
      redis:
        condition: service_healthy

    expose:
      - "8000"

    volumes:
      - document-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    networks:
      - edge-net
      - job-net

    restart: unless-stopped

  worker:
    image: docflow-backend:0.5.0

    command:
      - rq
      - worker
      - --url
      - ${REDIS_URL:-redis://redis:6379/0}
      - ${QUEUE_NAME:-document-jobs}

    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QUEUE_NAME: ${QUEUE_NAME:-document-jobs}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      RESULT_DIR: ${RESULT_DIR:-/data/results}

    depends_on:
      redis:
        condition: service_healthy

    volumes:
      - document-data:/data

    networks:
      - job-net

    restart: unless-stopped
    stop_grace_period: 30s
  smoke-test:
    image: python:3.12-alpine

    profiles:
      - test

    environment:
      BASE_URL: http://gateway
      EXPECTED_API_VERSION: 0.5.0
      POLL_TIMEOUT_SECONDS: 60

    command:
      - python
      - /tests/tests.py

    depends_on:
      gateway:
        condition: service_healthy

    volumes:
      - ./tests:/tests:ro

    networks:
      - edge-net

    restart: "no"
volumes:
  redis-data:
  document-data:

networks:
  edge-net:

  job-net:
    internal: true