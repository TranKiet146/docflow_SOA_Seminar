name: DocFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Docker Compose integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose --profile test config --quiet

      - name: Validate Python test syntax
        run: python3 -m py_compile tests/tests.py

      - name: Build application images
        run: docker compose build

      - name: Start DocFlow services
        run: docker compose up -d

      - name: Wait for Gateway health
        shell: bash
        run: |
          set -euo pipefail

          gateway_id="$(docker compose ps -q gateway)"

          if [ -z "$gateway_id" ]; then
            echo "Gateway container was not created"
            docker compose ps
            exit 1
          fi

          for attempt in $(seq 1 30); do
            status="$(
              docker inspect \
                --format '{{.State.Health.Status}}' \
                "$gateway_id"
            )"

            echo "Gateway health attempt $attempt: $status"

            if [ "$status" = "healthy" ]; then
              exit 0
            fi

            sleep 2
          done

          echo "Gateway did not become healthy"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run end-to-end smoke test
        run: docker compose --profile test run --rm smoke-test

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up containers and volumes
        if: always()
        run: |
          docker compose \
            --profile test \
            down \
            --volumes \
            --remove-orphans
